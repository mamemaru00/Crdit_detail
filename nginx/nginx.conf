server {
    listen 80;
    server_name localhost;

    # gzip compression
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;

    location / {
        proxy_pass http://web:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # File upload size limit
        # Production: 10MB (security best practice - DoS protection)
        # Test: 20MB (performance testing)
        # Override via CSV_MAX_FILE_SIZE environment variable
        client_max_body_size 10M;

        # JSON response NaN to null conversion
        # sub_filter requires ngx_http_sub_module (included in nginx:alpine)
        sub_filter_types application/json;
        sub_filter_once off;

        # Replace NaN with null in JSON responses
        # Pattern: "field":NaN or "field": NaN (with optional space)
        sub_filter ':NaN,' ':null,';
        sub_filter ': NaN,' ': null,';
        sub_filter ':NaN}' ':null}';
        sub_filter ': NaN}' ': null}';
        sub_filter ':NaN]' ':null]';
        sub_filter ': NaN]' ': null]';

        # Edge case patterns for array handling
        sub_filter '[NaN,' '[null,';      # Array start
        sub_filter '[NaN]' '[null]';      # Array single element
        sub_filter ',NaN,' ',null,';      # Array middle
        sub_filter ',NaN]' ',null]';      # Array end
    }

    # Health check endpoint
    location /health {
        proxy_pass http://web:5000/;
        proxy_set_header Host $host;
    }
}
